<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #000;
  }
  #img {
    max-width: 100vw; max-height: 100vh;
    object-fit: contain;
    display: block;
  }
  #footer {
    position: fixed; left: 50%; bottom: 14px;
    transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center;
    padding: 6px;
    background: rgba(30,30,30,.85);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    font: 14px/1 system-ui, sans-serif;
  }
  #footer.visible { opacity: 1; pointer-events: auto; }
  #footer .counter {
    margin: 0 4px; padding: 0 8px;
    font: 13px/1 system-ui, sans-serif;
    color: rgba(255,255,255,.6);
    white-space: nowrap;
  }
  #footer button {
    appearance: none; cursor: pointer;
    border: 0; border-radius: 6px;
    padding: 8px 14px;
    font: inherit; color: #eee;
    background: #333;
    transition: background .15s ease;
  }
  #footer button.hot { background: #444; }
  #footer button:not(:disabled):hover { background: #444; }
  #footer button:disabled { color: #666; cursor: default; }
  kbd {
    font: 10px/1 ui-monospace, monospace;
    padding: 1px 4px; margin-left: 6px;
    color: #999;
    border: 1px solid #555; border-radius: 4px;
  }
  #overview {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.72);
  }
  #overview.open { display: flex; }
  #list {
    max-width: 90vw; max-height: 80vh; overflow: auto;
    display: flex; flex-direction: column; gap: 4px;
    padding: 14px;
    background: rgba(30,30,30,.95);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
  }
  #list button {
    appearance: none; cursor: pointer; text-align: left;
    border: 0; border-radius: 6px;
    padding: 8px 12px; font: 14px/1.3 system-ui, sans-serif;
    color: #eee; background: transparent;
  }
  #list button:hover { background: #333; }
  #list button.active {
    background: #d4a017;
    color: #111;
  }
  #list button.selected {
    background: #1a5bd4;
    color: #fff;
  }
  #list .num {
    display: inline-block; width: 2.4em; text-align: right;
    margin-right: 8px; color: #888; font-variant-numeric: tabular-nums;
  }
  #list button.active .num { color: #5a3d00; }
  #list button.selected .num { color: #cfe; }
</style>
</head>
<body>
  <main id="stage">
    <img id="img" alt="">
  </main>
  <nav id="footer">
    <button id="prev" title="Previous (Left / Up)">Prev</button>
    <span id="counter" class="counter"></span>
    <button id="ovbtn">Slides overview<kbd>Esc</kbd></button>
    <button id="next" title="Next (Right / Down)">Next</button>
  </nav>
  <div id="overview">
    <div id="list"></div>
  </div>

  <script type="application/json" id="data">/*__SLIDES__*/</script>
  <script>
    const img = document.getElementById('img');
    const stage = document.getElementById('stage');
    const counter = document.getElementById('counter');
    const footer = document.getElementById('footer');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const overview = document.getElementById('overview');
    const list = document.getElementById('list');
    const ovbtn = document.getElementById('ovbtn');

    const slides = JSON.parse(document.getElementById('data').textContent);
    let index = 0;
    let preview = 0;

    function renderAt(i) {
      const s = slides[i];
      img.src = s.image;
      counter.textContent = `${i + 1} / ${slides.length}`;
      document.title = `${i + 1}/${slides.length} - ${s.title}`;
      prev.disabled = i === 0;
      next.disabled = i === slides.length - 1;
    }

    const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    function buildList() {
      list.innerHTML = '';
      slides.forEach((s, i) => {
        const b = document.createElement('button');
        b.innerHTML = `<span class="num">${i + 1}</span>${esc(s.title)}`;
        b.addEventListener('mouseenter', () => { if (overview.classList.contains('open')) { preview = i; renderAt(preview); highlight(); } });
        b.addEventListener('click', () => commitTo(i));
        list.appendChild(b);
      });
    }

    function highlight() {
      [...list.children].forEach((b, n) => {
        b.classList.toggle('active', n === index);
        b.classList.toggle('selected', n === preview);
      });
    }

    function openOverview() { preview = index; highlight(); overview.classList.add('open'); }

    function commitTo(i) {
      index = i;
      preview = i;
      location.hash = String(i + 1);
      renderAt(index);
      highlight();
      overview.classList.remove('open');
    }

    function revert() {
      preview = index;
      overview.classList.remove('open');
      renderAt(index);
    }

    function movePreview(d) {
      const t = preview + d;
      if (t >= 0 && t < slides.length) { preview = t; renderAt(preview); highlight(); }
    }

    const goto = (d) => {
      const target = index + d;
      if (target >= 0 && target < slides.length) { index = target; location.hash = String(target + 1); renderAt(index); }
    };

    document.addEventListener('mousemove', () => footer.classList.add('visible'));
    document.addEventListener('mouseleave', () => footer.classList.remove('visible'));

    function heat(e) {
      const r = stage.getBoundingClientRect();
      const leftHalf = e.clientX < r.left + r.width / 2;
      prev.classList.toggle('hot', leftHalf);
      next.classList.toggle('hot', !leftHalf);
    }
    stage.addEventListener('mousemove', heat);
    stage.addEventListener('click', (e) => {
      const r = stage.getBoundingClientRect();
      (e.clientX < r.left + r.width / 2 ? goto(-1) : goto(1));
    });

    overview.addEventListener('click', (e) => { if (e.target === overview) revert(); });
    ovbtn.addEventListener('click', openOverview);
    prev.addEventListener('click', () => goto(-1));
    next.addEventListener('click', () => goto(1));

    document.addEventListener('keydown', (e) => {
      if (overview.classList.contains('open')) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') movePreview(-1);
        else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') movePreview(1);
        else if (e.key === 'Enter') commitTo(preview);
        else if (e.key === 'Escape') revert();
        return;
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goto(-1);
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goto(1);
      else if (e.key === 'Escape') openOverview();
    });

    const start = Math.min(Math.max((Number(location.hash.slice(1)) || 1) - 1, 0), slides.length - 1);
    index = start;
    buildList();
    renderAt(index);
  </script>
  </script>
</body>
</html>
